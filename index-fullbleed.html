<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wann.ca — photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--bone:#EDEAE4;--gray:#7E7E86;--safelight:#E23E2C;--pad:clamp(14px,3.5vw,40px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase}

/* minimal chrome: corner marks only */
.corner{position:fixed;z-index:70;color:var(--bone);mix-blend-mode:difference}
.tl{top:var(--pad);left:var(--pad);font-weight:800;font-size:14px;letter-spacing:-.02em}
.tr{top:var(--pad);right:var(--pad);display:flex;gap:14px;align-items:center}
.bl{bottom:var(--pad);left:var(--pad)}
.br{bottom:var(--pad);right:var(--pad)}
.corner button{background:none;border:none;color:inherit;cursor:pointer;letter-spacing:.2em}
.corner button.dim{opacity:.45}

/* the reel */
.frame{position:relative;height:100svh;overflow:hidden;cursor:zoom-in}
.frame img{position:absolute;inset:0;will-change:transform}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent 26%,transparent 74%,rgba(0,0,0,.45))}
.meta{position:absolute;left:var(--pad);bottom:calc(var(--pad) + 26px);z-index:5;max-width:70vw;
  opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.frame.in .meta{opacity:1;transform:none}
.meta h3{font-size:clamp(24px,5vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1}
.meta .ex{margin-top:8px;color:var(--gray)}

/* chapter title cards between groups */
.card{height:70svh;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);
  border-top:1px solid #1B1B1F}
.card h2{font-size:clamp(48px,15vw,220px);font-weight:800;letter-spacing:-.05em;line-height:.82;
  opacity:0;transform:translateY(30px);transition:.9s cubic-bezier(.2,.7,.2,1)}
.card .sub{margin-top:14px;color:var(--gray);opacity:0;transform:translateY(20px);transition:.9s ease .15s}
.card.in h2,.card.in .sub{opacity:1;transform:none}

/* opening title over first frame */
.title{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 var(--pad) clamp(60px,14vh,140px);pointer-events:none}
.title h1{font-size:clamp(66px,21vw,260px);font-weight:800;letter-spacing:-.05em;line-height:.8}
.title h1 em{font-style:normal;color:var(--safelight)}
.title p{margin-top:14px;max-width:44ch;color:var(--gray);line-height:1.7}

.end{padding:clamp(60px,14vh,150px) var(--pad);border-top:1px solid #1B1B1F;
  display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,80px)}
.end p{line-height:1.8;font-size:clamp(16px,2.1vw,21px);color:#C6C3BD;max-width:54ch}
.end p+p{margin-top:18px}
.specs{list-style:none;color:var(--gray);line-height:2.2;border-top:1px solid #1B1B1F;padding-top:14px}
.specs b{color:var(--bone);font-weight:500}
@media(max-width:820px){.end{grid-template-columns:1fr}}
footer{padding:20px var(--pad) 40px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;color:var(--gray)}

/* index overlay */
.index{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.96);padding:calc(var(--pad) + 40px) var(--pad);
  overflow-y:auto;display:none}
.index.open{display:block}
.index .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(110px,16vw,180px),1fr));gap:8px}
.index .grid button{position:relative;border:none;padding:0;background:#111;cursor:pointer;aspect-ratio:1;overflow:hidden}
.index .grid img{transition:opacity .3s;opacity:.72}
.index .grid button:hover img{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .meta,.card h2,.card .sub{opacity:1!important;transform:none!important}}
</style>
</head>
<body>

<div class="corner tl"><a href="#top">wann.ca</a></div>
<div class="corner tr mono">
  <button id="langbtn"></button>
  <button id="indexbtn"></button>
</div>
<div class="corner bl mono" id="counter"></div>
<div class="corner br mono" id="nowshowing"></div>

<main id="reel"></main>

<section class="end" id="about">
  <div><p id="about1"></p><p id="about2"></p></div>
  <ul class="specs mono" id="specslist"></ul>
</section>
<footer class="mono">
  <span>© <span id="yr"></span> Antoine Wann</span>
  <span><a href="mailto:hello@wann.ca">hello@wann.ca</a></span>
</footer>

<div class="index" id="index">
  <div class="grid" id="indexgrid"></div>
</div>

<script src="content.js"></script>
<script>
let LANG = localStorage.getItem("wann-lang") || (navigator.language.startsWith("fr") ? "fr" : "en");
let flat = [];

function render(){
  document.documentElement.lang = LANG;
  langbtn.textContent = LANG === "en" ? "FR" : "EN";
  indexbtn.textContent = UI.index[LANG];
  about1.textContent = UI.about1[LANG];
  about2.textContent = UI.about2[LANG];
  specslist.innerHTML = `
    <li><b>${UI.specs.body[LANG]}</b> — Sony a6400</li>
    <li><b>${UI.specs.glass[LANG]}</b> — Sigma 30mm ƒ1.4 · Sony 18–135mm</li>
    <li><b>${UI.specs.edit[LANG]}</b> — Lightroom</li>
    <li><b>${UI.specs.based[LANG]}</b> — Québec, Canada</li>`;

  flat = [];
  let html = "";
  SETS.forEach((set, si) => {
    html += `<section class="card" id="${set.id}"><h2>${set.name[LANG]}</h2>
      <div class="sub mono">${set.note[LANG]} — ${String(set.photos.length).padStart(2,"0")} ${UI.frames[LANG]}</div></section>`;
    set.photos.forEach(p => {
      flat.push({...p, set:set.name[LANG]});
      const first = si === 0 && flat.length === 1;
      html += `<figure class="frame" data-i="${flat.length-1}" data-set="${set.name[LANG]}">
        <img src="photos/${p.src}" alt="${p.title[LANG]}" ${first ? "" : 'loading="lazy"'}>
        ${first ? `<div class="title"><h1>WANN<em>.</em></h1><p class="mono">${UI.strap[LANG]}</p></div>` : ""}
        <figcaption class="meta">
          <h3>${p.title[LANG]}</h3><div class="ex mono">${p.exif}</div>
        </figcaption>
      </figure>`;
    });
  });
  reel.innerHTML = html;

  indexgrid.innerHTML = flat.map((p,i) =>
    `<button data-jump="${i}"><img src="photos/${p.src}" alt="${p.title[LANG]}" loading="lazy"></button>`).join("");

  observe();
}

function observe(){
  const frames = [...document.querySelectorAll(".frame")];
  const io = new IntersectionObserver(es => es.forEach(e => {
    e.target.classList.toggle("in", e.isIntersecting && e.intersectionRatio > .45);
    if (e.isIntersecting && e.intersectionRatio > .5){
      const i = +e.target.dataset.i;
      counter.textContent = `${String(i+1).padStart(3,"0")} / ${String(flat.length).padStart(3,"0")}`;
      nowshowing.textContent = e.target.dataset.set;
    }
  }), {threshold:[.2,.45,.5,.7]});
  frames.forEach(f => io.observe(f));

  const cio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) e.target.classList.add("in");
  }), {threshold:.3});
  document.querySelectorAll(".card").forEach(c => cio.observe(c));
}

/* slow parallax inside each frame */
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    document.querySelectorAll(".frame").forEach(f => {
      const r = f.getBoundingClientRect();
      if (r.bottom < -200 || r.top > innerHeight + 200) return;
      const p = (r.top + r.height/2 - innerHeight/2) / innerHeight;
      f.querySelector("img").style.transform = `scale(1.12) translateY(${p * -34}px)`;
    });
    ticking = false;
  });
}, {passive:true});

langbtn.addEventListener("click", () => {
  LANG = LANG === "en" ? "fr" : "en";
  localStorage.setItem("wann-lang", LANG); render();
});
indexbtn.addEventListener("click", () => {
  index.classList.toggle("open");
  document.body.style.overflow = index.classList.contains("open") ? "hidden" : "";
});
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j){
    index.classList.remove("open"); document.body.style.overflow = "";
    document.querySelector(`.frame[data-i="${j.dataset.jump}"]`).scrollIntoView({behavior:"smooth"});
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && index.classList.contains("open")){
    index.classList.remove("open"); document.body.style.overflow = "";
  }
});
yr.textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
