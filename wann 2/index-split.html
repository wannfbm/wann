<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wann.ca — photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F0F12;--panel:#141418;--bone:#EDEAE4;--gray:#83838B;--line:#26262C;
  --safelight:#E23E2C;--pad:clamp(18px,3vw,44px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase}

.shell{display:grid;grid-template-columns:minmax(300px,34vw) 1fr;min-height:100svh}

/* fixed left panel */
.panel{position:sticky;top:0;height:100svh;padding:var(--pad);border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);z-index:5}
.brand{font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand span{color:var(--safelight)}
.panel h1{font-size:clamp(40px,4.4vw,74px);font-weight:800;letter-spacing:-.045em;line-height:.86;margin-top:26px}
.panel h1 em{font-style:normal;color:var(--safelight)}
.panel .strap{margin-top:16px;color:var(--gray);line-height:1.7;max-width:38ch}
.panelmid{margin-top:auto;padding-top:26px}
.chaplist{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:20px}
.chaplist a{display:flex;justify-content:space-between;gap:12px;color:var(--gray);padding-bottom:7px;
  border-bottom:1px solid var(--line);transition:color .25s,border-color .25s}
.chaplist a:hover,.chaplist a.on{color:var(--bone);border-color:var(--safelight)}
.now{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);min-height:74px}
.now .t{font-size:clamp(15px,1.5vw,19px);font-weight:600;letter-spacing:-.01em;transition:opacity .35s}
.now .e{color:var(--gray);margin-top:5px}
.panelfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line);color:var(--gray)}
.langtoggle{display:flex;gap:3px;background:none;border:1px solid var(--line);border-radius:20px;padding:3px;cursor:pointer}
.langtoggle span{padding:4px 9px;border-radius:16px;color:var(--gray);transition:.2s}
.langtoggle span.on{background:var(--bone);color:var(--ink)}

/* right column of images */
.rail{padding:var(--pad)}
.chapter{padding-bottom:clamp(40px,8vh,90px)}
.chapmark{position:sticky;top:0;z-index:4;background:linear-gradient(to bottom,var(--ink) 62%,transparent);
  padding:14px 0 20px;display:flex;justify-content:space-between;gap:16px;align-items:baseline;color:var(--gray)}
.chapmark b{color:var(--bone);font-weight:600;font-size:clamp(17px,2vw,23px);letter-spacing:-.02em;text-transform:none}
.shots{display:flex;flex-direction:column;gap:clamp(14px,2.4vw,28px)}
.shot{position:relative;overflow:hidden;background:#17171B;border:none;padding:0;cursor:zoom-in;width:100%;
  opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.shot.in{opacity:1;transform:none}
.shot::before{content:"";display:block;padding-top:var(--ratio,62%)}
.shot img{position:absolute;inset:0;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.shot:hover img{transform:scale(1.03)}
.shot .num{position:absolute;top:10px;left:10px;z-index:2;color:rgba(237,234,228,.55);
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,28px)}

.about{padding:clamp(40px,8vh,90px) 0;border-top:1px solid var(--line)}
.about p{line-height:1.8;font-size:clamp(16px,1.6vw,20px);color:#C6C3BD;max-width:56ch}
.about p+p{margin-top:16px}
.specs{list-style:none;color:var(--gray);line-height:2.1;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.specs b{color:var(--bone);font-weight:500}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .panel{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line);
    padding-bottom:28px}
  .panelmid{margin-top:30px}
  .now{display:none}
  .pair{grid-template-columns:1fr}
}
/* lightbox */
.box{position:fixed;inset:0;z-index:100;background:rgba(9,9,11,.98);display:none;align-items:center;
  justify-content:center;padding:clamp(12px,4vw,60px)}
.box.open{display:flex}
.box figure{max-width:min(1450px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.box .stage img{max-height:78svh;max-width:100%;width:auto;height:auto;object-fit:contain}
.box figcaption{display:flex;justify-content:space-between;gap:24px;width:100%;color:var(--gray)}
.box .ctrl{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:8px}
.box button{background:none;border:1px solid var(--line);color:var(--bone);padding:8px 14px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em}
.box button:hover{border-color:var(--safelight)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.shot{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="shell">
  <aside class="panel">
    <div>
      <a class="brand" href="#top">wann<span>.</span>ca</a>
      <h1 id="top">WANN<em>.</em></h1>
      <p class="strap mono" id="strap"></p>
    </div>
    <div class="panelmid">
      <div class="mono" style="color:var(--gray)" id="idxlabel"></div>
      <ul class="chaplist mono" id="chaplist"></ul>
      <div class="now"><div class="t" id="nowTitle"></div><div class="e mono" id="nowExif"></div></div>
      <div class="panelfoot mono">
        <a href="mailto:hello@wann.ca">hello@wann.ca</a>
        <button class="langtoggle" id="langtoggle" aria-label="Switch language">
          <span data-lang="en">EN</span><span data-lang="fr">FR</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="rail">
    <main id="work"></main>
    <section class="about" id="about">
      <p id="about1"></p><p id="about2"></p>
      <ul class="specs mono" id="specslist"></ul>
      <div class="mono" style="color:var(--gray);margin-top:26px">© <span id="yr"></span> Antoine Wann</div>
    </section>
  </div>
</div>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="ctrl">
    <button data-nav="-1" id="btnPrev"></button>
    <button data-nav="1" id="btnNext"></button>
    <button data-close id="btnClose"></button>
  </div>
  <figure><div class="stage" id="stage"></div>
    <figcaption class="mono"><span id="capTitle"></span><span id="capExif"></span></figcaption></figure>
</div>

<script src="content.js"></script>
<script>
let LANG = localStorage.getItem("wann-lang") || (navigator.language.startsWith("fr") ? "fr" : "en");
let flat = [];

function render(){
  document.documentElement.lang = LANG;
  strap.textContent = UI.strap[LANG];
  idxlabel.textContent = UI.index[LANG];
  about1.textContent = UI.about1[LANG];
  about2.textContent = UI.about2[LANG];
  specslist.innerHTML = `
    <li><b>${UI.specs.body[LANG]}</b> — Sony a6400</li>
    <li><b>${UI.specs.glass[LANG]}</b> — Sigma 30mm ƒ1.4 · Sony 18–135mm</li>
    <li><b>${UI.specs.edit[LANG]}</b> — Lightroom</li>
    <li><b>${UI.specs.based[LANG]}</b> — Québec, Canada</li>`;
  btnPrev.textContent = UI.prev[LANG];
  btnNext.textContent = UI.next[LANG];
  btnClose.textContent = UI.close[LANG];
  document.querySelectorAll(".langtoggle span").forEach(s => s.classList.toggle("on", s.dataset.lang === LANG));

  flat = [];
  work.innerHTML = SETS.map(set => {
    // pair up consecutive vertical shots so the column keeps rhythm
    let out = "", buffer = [];
    const flush = () => {
      if (!buffer.length) return;
      out += buffer.length === 2 ? `<div class="pair">${buffer.join("")}</div>` : buffer.join("");
      buffer = [];
    };
    set.photos.forEach(p => {
      flat.push(p);
      const cell = `<button class="shot" style="--ratio:${p.ratio}%" data-i="${flat.length-1}">
          <img src="photos/${p.src}" alt="${p.title[LANG]}" loading="lazy">
          <span class="num mono">${String(flat.length).padStart(3,"0")}</span>
        </button>`;
      if (p.ratio > 100){ buffer.push(cell); if (buffer.length === 2) flush(); }
      else { flush(); out += cell; }
    });
    flush();
    return `<section class="chapter" id="${set.id}">
      <div class="chapmark mono"><b>${set.name[LANG]}</b>
        <span>${set.note[LANG]} · ${String(set.photos.length).padStart(2,"0")} ${UI.frames[LANG]}</span></div>
      <div class="shots">${out}</div>
    </section>`;
  }).join("");

  chaplist.innerHTML = SETS.map(s =>
    `<li><a href="#${s.id}"><span>${s.name[LANG]}</span><span>${String(s.photos.length).padStart(2,"0")}</span></a></li>`
  ).join("") + `<li><a href="#about"><span>${UI.about[LANG]}</span><span>—</span></a></li>`;

  observe();
}

function observe(){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), {rootMargin:"0px 0px -8% 0px", threshold:.1});
  document.querySelectorAll(".shot").forEach(el => io.observe(el));

  // left panel shows whatever photo is centred in the viewport
  const live = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){
      const p = flat[+e.target.dataset.i];
      nowTitle.textContent = p.title[LANG];
      nowExif.textContent = p.exif;
    }
  }), {rootMargin:"-42% 0px -42% 0px"});
  document.querySelectorAll(".shot").forEach(el => live.observe(el));

  const links = [...document.querySelectorAll(".chaplist a")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
  }), {rootMargin:"-40% 0px -50% 0px"});
  document.querySelectorAll(".chapter,#about").forEach(s => spy.observe(s));
}

langtoggle.addEventListener("click", () => {
  LANG = LANG === "en" ? "fr" : "en";
  localStorage.setItem("wann-lang", LANG); render();
});
yr.textContent = new Date().getFullYear();

let cur = 0;
function show(i){
  cur = (i + flat.length) % flat.length; const p = flat[cur];
  stage.innerHTML = `<img src="photos/${p.src}" alt="${p.title[LANG]}">`;
  capTitle.textContent = `${String(cur+1).padStart(3,"0")} — ${p.title[LANG]}`;
  capExif.textContent = p.exif;
  box.classList.add("open"); document.body.style.overflow = "hidden";
}
function closeBox(){ box.classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("click", e => {
  const s = e.target.closest(".shot"); if (s) return show(+s.dataset.i);
  if (e.target.closest("[data-close]") || e.target === box) return closeBox();
  const n = e.target.closest("[data-nav]"); if (n) show(cur + (+n.dataset.nav));
});
document.addEventListener("keydown", e => {
  if (!box.classList.contains("open")) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowRight") show(cur+1);
  if (e.key === "ArrowLeft") show(cur-1);
});
render();
</script>
</body>
</html>
