<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wann.ca — photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --ink:#1A1815; --soft:#6E6A62; --rule:#DAD5CB; --accent:#8C3A2B;
  --pad:clamp(20px,6vw,90px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit}
.serif{font-family:"Newsreader",Georgia,serif;font-weight:300}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}

.nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--pad);background:rgba(246,244,239,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.mark{font-family:"Newsreader",serif;font-size:19px;letter-spacing:.02em}
.nav-right{display:flex;align-items:center;gap:clamp(14px,3vw,30px)}
.nav ul{display:flex;gap:clamp(10px,2.4vw,24px);list-style:none;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{color:var(--soft);white-space:nowrap;transition:color .2s}
.nav a:hover,.nav a.on{color:var(--accent)}
.langtoggle{display:flex;gap:2px;background:none;border:1px solid var(--rule);border-radius:2px;padding:2px;cursor:pointer;flex:none}
.langtoggle span{padding:4px 8px;color:var(--soft);font-size:11px;letter-spacing:.14em;transition:.2s}
.langtoggle span.on{background:var(--ink);color:var(--paper)}

/* masthead */
.masthead{padding:clamp(50px,11vh,120px) var(--pad) clamp(30px,6vh,60px);border-bottom:1px solid var(--rule)}
.masthead h1{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(52px,10vw,140px);
  line-height:.94;letter-spacing:-.02em}
.masthead h1 em{font-style:italic;color:var(--accent)}
.masthead .strap{margin-top:22px;max-width:44ch;font-family:"Newsreader",serif;font-weight:300;
  font-size:clamp(18px,2.4vw,25px);line-height:1.55;color:#3E3A34}
.openplate{margin:0 var(--pad);padding:clamp(28px,6vh,56px) 0}
.openplate img{border:1px solid var(--rule)}
.openplate .cap{display:flex;justify-content:space-between;gap:20px;padding-top:10px}

/* chapters */
.chapter{padding:clamp(48px,9vh,110px) var(--pad) 0}
.chaphead{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:baseline;
  border-top:1px solid var(--ink);padding-top:14px;margin-bottom:clamp(26px,5vh,50px)}
.chaphead h2{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(30px,5.2vw,58px);letter-spacing:-.015em}
.chaphead .rule{height:1px;background:var(--rule);transform:translateY(-6px)}

/* the book grid: images with wide margins, captions beneath */
.spread{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(18px,3vw,44px) clamp(16px,2.6vw,36px)}
.fig{grid-column:span 12;opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.fig.in{opacity:1;transform:none}
.fig button{display:block;width:100%;border:none;padding:0;background:none;cursor:zoom-in;text-align:left;color:inherit}
.fig img{border:1px solid var(--rule);transition:opacity .4s}
.fig button:hover img{opacity:.9}
.fig .cap{display:flex;justify-content:space-between;gap:16px;padding-top:9px;align-items:baseline}
.fig .ttl{font-family:"Newsreader",serif;font-size:clamp(15px,1.7vw,18px)}
.fig .no{color:var(--soft);font-size:11px;letter-spacing:.16em}
.fig.half{grid-column:span 6}
.fig.third{grid-column:span 4}
.fig.wide{grid-column:span 12}
.fig.indent{grid-column:2 / span 10}
@media(max-width:820px){ .fig,.fig.half,.fig.third,.fig.indent{grid-column:span 12} }

/* colophon */
.colophon{margin-top:clamp(60px,12vh,140px);padding:clamp(40px,8vh,90px) var(--pad);
  border-top:1px solid var(--ink);display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(26px,5vw,80px)}
.colophon p{font-family:"Newsreader",serif;font-weight:300;font-size:clamp(17px,2.1vw,22px);
  line-height:1.7;max-width:54ch;color:#33302B}
.colophon p+p{margin-top:18px}
.specs{list-style:none;line-height:2.1;font-size:13px;color:var(--soft)}
.specs b{color:var(--ink);font-weight:500}
@media(max-width:820px){.colophon{grid-template-columns:1fr}}
footer{padding:20px var(--pad) 40px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:14px;
  justify-content:space-between;color:var(--soft);font-size:12px}
footer a:hover{color:var(--accent)}

/* lightbox */
.box{position:fixed;inset:0;z-index:100;background:rgba(246,244,239,.985);display:none;align-items:center;
  justify-content:center;padding:clamp(14px,4vw,64px)}
.box.open{display:flex}
.box figure{max-width:min(1400px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.box .stage img{max-height:78svh;max-width:100%;width:auto;border:1px solid var(--rule)}
.box figcaption{display:flex;justify-content:space-between;gap:24px;width:100%;color:var(--soft);font-size:12px}
.box .ctrl{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:8px}
.box button{background:none;border:1px solid var(--rule);color:var(--ink);padding:7px 13px;cursor:pointer;
  font-size:11px;letter-spacing:.14em}
.box button:hover{border-color:var(--accent);color:var(--accent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fig{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="nav">
  <a class="mark" href="#top">wann.ca</a>
  <div class="nav-right">
    <ul class="label" id="navlist"></ul>
    <button class="langtoggle" id="langtoggle" aria-label="Switch language">
      <span data-lang="en">EN</span><span data-lang="fr">FR</span>
    </button>
  </div>
</nav>

<header class="masthead" id="top">
  <h1>Wann<em>.</em></h1>
  <p class="strap" id="strap"></p>
</header>

<div class="openplate">
  <img src="photos/street-youville.jpg" alt="">
  <div class="cap label"><span id="opencap"></span><span>Place d'Youville</span></div>
</div>

<main id="work"></main>

<section class="colophon" id="about">
  <div><p id="about1"></p><p id="about2"></p></div>
  <ul class="specs" id="specslist"></ul>
</section>

<footer>
  <span>© <span id="yr"></span> Antoine Wann</span>
  <span><a href="mailto:hello@wann.ca">hello@wann.ca</a></span>
</footer>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="ctrl">
    <button data-nav="-1" id="btnPrev"></button>
    <button data-nav="1" id="btnNext"></button>
    <button data-close id="btnClose"></button>
  </div>
  <figure><div class="stage" id="stage"></div>
    <figcaption><span id="capTitle"></span><span id="capExif"></span></figcaption></figure>
</div>

<script src="content.js"></script>
<script>
let LANG = localStorage.getItem("wann-lang") || (navigator.language.startsWith("fr") ? "fr" : "en");
let flat = [];
const PATTERN = ["wide","half","half","indent","third","third","third","half","half"];

function render(){
  document.documentElement.lang = LANG;
  strap.textContent = UI.strap[LANG];
  opencap.textContent = LANG === "fr" ? "Frontispice" : "Frontispiece";
  about1.textContent = UI.about1[LANG];
  about2.textContent = UI.about2[LANG];
  specslist.innerHTML = `
    <li><b>${UI.specs.body[LANG]}</b> — Sony a6400</li>
    <li><b>${UI.specs.glass[LANG]}</b> — Sigma 30mm ƒ1.4 · Sony 18–135mm</li>
    <li><b>${UI.specs.edit[LANG]}</b> — Lightroom</li>
    <li><b>${UI.specs.based[LANG]}</b> — Québec, Canada</li>`;
  btnPrev.textContent = UI.prev[LANG];
  btnNext.textContent = UI.next[LANG];
  btnClose.textContent = UI.close[LANG];
  document.querySelectorAll(".langtoggle span").forEach(s => s.classList.toggle("on", s.dataset.lang === LANG));

  flat = [];
  work.innerHTML = SETS.map((set, si) => `
    <section class="chapter" id="${set.id}">
      <div class="chaphead">
        <h2>${set.name[LANG]}</h2><div class="rule"></div>
        <div class="label">${set.note[LANG]} · ${String(set.photos.length).padStart(2,"0")} ${UI.frames[LANG]}</div>
      </div>
      <div class="spread">
        ${set.photos.map((p, i) => {
          flat.push(p);
          const cls = p.ratio > 100 ? (i % 2 ? "half" : "third") : PATTERN[i % PATTERN.length];
          return `<figure class="fig ${cls}">
            <button data-i="${flat.length-1}"><img src="photos/${p.src}" alt="${p.title[LANG]}" loading="lazy"></button>
            <figcaption class="cap">
              <span class="ttl">${p.title[LANG]}</span>
              <span class="no">${String(flat.length).padStart(3,"0")}</span>
            </figcaption>
          </figure>`;
        }).join("")}
      </div>
    </section>`).join("");

  navlist.innerHTML = SETS.map(s => `<li><a href="#${s.id}">${s.name[LANG]}</a></li>`).join("")
    + `<li><a href="#about">${UI.about[LANG]}</a></li>`;
  observe();
}

function observe(){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), {rootMargin:"0px 0px -8% 0px", threshold:.08});
  document.querySelectorAll(".fig").forEach(el => io.observe(el));
  const links = [...document.querySelectorAll(".nav a[href^='#']")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
  }), {rootMargin:"-40% 0px -50% 0px"});
  document.querySelectorAll(".chapter,#about").forEach(s => spy.observe(s));
}

langtoggle.addEventListener("click", () => {
  LANG = LANG === "en" ? "fr" : "en";
  localStorage.setItem("wann-lang", LANG); render();
});
yr.textContent = new Date().getFullYear();

let cur = 0;
function show(i){
  cur = (i + flat.length) % flat.length; const p = flat[cur];
  stage.innerHTML = `<img src="photos/${p.src}" alt="${p.title[LANG]}">`;
  capTitle.textContent = `${String(cur+1).padStart(3,"0")} — ${p.title[LANG]}`;
  capExif.textContent = p.exif;
  box.classList.add("open"); document.body.style.overflow = "hidden";
}
function closeBox(){ box.classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("click", e => {
  const b = e.target.closest(".fig button"); if (b) return show(+b.dataset.i);
  if (e.target.closest("[data-close]") || e.target === box) return closeBox();
  const n = e.target.closest("[data-nav]"); if (n) show(cur + (+n.dataset.nav));
});
document.addEventListener("keydown", e => {
  if (!box.classList.contains("open")) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowRight") show(cur+1);
  if (e.key === "ArrowLeft") show(cur-1);
});
render();
</script>
</body>
</html>
