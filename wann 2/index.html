<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wann.ca — photography</title>
<meta name="description" content="Landscape, garden and wildlife photography by Antoine Wann. Québec.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0E10; --panel:#17171A; --line:#2A2A2F;
  --bone:#EDEAE4; --gray:#8A8A90; --safelight:#E23E2C;
  --pad:clamp(16px,4vw,48px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--pad);background:linear-gradient(to bottom,rgba(14,14,16,.92),rgba(14,14,16,0));backdrop-filter:blur(6px)}
.mark{font-weight:800;letter-spacing:-.02em;font-size:15px}
.mark span{color:var(--safelight)}
.nav-right{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
.nav ul{display:flex;gap:clamp(10px,2.5vw,26px);list-style:none;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{color:var(--gray);padding-bottom:3px;border-bottom:1px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s}
.nav a:hover,.nav a:focus-visible,.nav a.on{color:var(--bone);border-color:var(--safelight)}
.langtoggle{display:flex;align-items:center;gap:4px;flex:none;background:none;border:1px solid var(--line);border-radius:20px;padding:3px;cursor:pointer}
.langtoggle span{padding:4px 9px;border-radius:16px;color:var(--gray);transition:.2s}
.langtoggle span.on{background:var(--bone);color:var(--ink)}

.hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
.hero .frame{position:absolute;inset:0}
.hero .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,14,16,.95) 6%,rgba(14,14,16,.15) 55%,rgba(14,14,16,.55))}
.hero-copy{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(28px,7vh,72px);z-index:2}
.hero h1{font-weight:800;letter-spacing:-.045em;line-height:.82;font-size:clamp(64px,19vw,230px);transform:translateY(14px);opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) .15s forwards}
.hero h1 em{font-style:normal;color:var(--safelight)}
.hero .strap{margin-top:14px;max-width:48ch;color:var(--gray);line-height:1.7;opacity:0;animation:rise .9s ease .45s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.scroll{position:absolute;right:var(--pad);bottom:clamp(28px,7vh,72px);z-index:2;color:var(--gray);writing-mode:vertical-rl}

.section{padding:clamp(64px,11vh,132px) var(--pad) 0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:22px}
.head h2{font-size:clamp(30px,6.5vw,60px);font-weight:800;letter-spacing:-.035em}
.head .meta{color:var(--gray);text-align:right;line-height:1.9;flex:none}

.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cell{position:relative;overflow:hidden;background:var(--panel);cursor:zoom-in;border:none;padding:0;color:inherit}
.cell::before{content:"";display:block;padding-top:var(--ratio,66%)}
.cell .media{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cell:hover .media,.cell:focus-visible .media{transform:scale(1.04)}
.cell .tag{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;opacity:0;transform:translateY(6px);transition:.28s;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.cell:hover .tag,.cell:focus-visible .tag{opacity:1;transform:none}
.cell .no{position:absolute;top:10px;left:10px;z-index:2;color:rgba(237,234,228,.6);text-shadow:0 1px 10px rgba(0,0,0,.9)}
.cell:focus-visible{outline:2px solid var(--safelight);outline-offset:2px}
.w6{grid-column:span 6}.w4{grid-column:span 4}.w3{grid-column:span 3}.w2{grid-column:span 2}
@media(max-width:820px){
  .sheet{grid-template-columns:repeat(2,1fr)}
  .w6,.w4,.w3{grid-column:span 2}
  .w2{grid-column:span 1}
}

.about{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,80px);align-items:start;padding-top:clamp(72px,12vh,150px)}
.about p{line-height:1.8;font-size:clamp(16px,2.1vw,20px);color:#C9C6C0;max-width:56ch}
.specs{list-style:none;color:var(--gray);line-height:2.2;border-top:1px solid var(--line);padding-top:14px}
.specs b{color:var(--bone);font-weight:500}
@media(max-width:820px){.about{grid-template-columns:1fr}}
footer{margin-top:clamp(72px,12vh,140px);padding:22px var(--pad) 34px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;color:var(--gray)}
footer a:hover{color:var(--safelight)}

.box{position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.97);display:none;align-items:center;justify-content:center;padding:clamp(12px,4vw,64px)}
.box.open{display:flex}
.box figure{max-width:min(1500px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.box .stage img{max-height:78svh;max-width:100%;width:auto;height:auto;object-fit:contain}
.box figcaption{display:flex;justify-content:space-between;gap:24px;width:100%;color:var(--gray)}
.box .ctrl{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:8px}
.box button{background:none;border:1px solid var(--line);color:var(--bone);padding:8px 14px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em}
.box button:hover{border-color:var(--safelight)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<nav class="nav">
  <a class="mark" href="#top">wann<span>.</span>ca</a>
  <div class="nav-right">
    <ul class="mono" id="navlist"></ul>
    <button class="langtoggle mono" id="langtoggle" aria-label="Switch language">
      <span data-lang="en">EN</span><span data-lang="fr">FR</span>
    </button>
  </div>
</nav>

<header class="hero" id="top">
  <div class="frame"><img src="photos/street-youville.jpg" alt=""></div>
  <div class="hero-copy">
    <h1>WANN<em>.</em></h1>
    <p class="strap mono" id="strap"></p>
  </div>
  <div class="scroll mono" id="scrolltxt"></div>
</header>

<main id="work"></main>

<section class="section about" id="about">
  <div>
    <p id="about1"></p>
    <p style="margin-top:20px" id="about2"></p>
  </div>
  <ul class="specs mono" id="specslist"></ul>
</section>

<footer class="mono">
  <span>© <span id="yr"></span> Antoine Wann</span>
  <span><a href="mailto:hello@wann.ca">hello@wann.ca</a></span>
</footer>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="ctrl">
    <button data-nav="-1" id="btnPrev">← Prev</button>
    <button data-nav="1" id="btnNext">Next →</button>
    <button data-close id="btnClose">Close ✕</button>
  </div>
  <figure>
    <div class="stage" id="stage"></div>
    <figcaption class="mono"><span id="capTitle"></span><span id="capExif"></span></figcaption>
  </figure>
</div>

<script src="content.js"></script>
<script>

/* ---------- language state ---------- */
let LANG = localStorage.getItem("wann-lang") || (navigator.language.startsWith("fr") ? "fr" : "en");

function render(){
  document.documentElement.lang = LANG;
  document.getElementById("strap").textContent = UI.strap[LANG];
  document.getElementById("scrolltxt").textContent = UI.scroll[LANG];
  document.getElementById("about1").textContent = UI.about1[LANG];
  document.getElementById("about2").textContent = UI.about2[LANG];
  document.getElementById("specslist").innerHTML = `
    <li><b>${UI.specs.body[LANG]}</b> — Sony a6400</li>
    <li><b>${UI.specs.glass[LANG]}</b> — Sigma 30mm ƒ1.4 · Sony 18–135mm</li>
    <li><b>${UI.specs.edit[LANG]}</b> — Lightroom</li>
    <li><b>${UI.specs.based[LANG]}</b> — Québec, Canada</li>`;
  document.getElementById("btnPrev").textContent = UI.prev[LANG];
  document.getElementById("btnNext").textContent = UI.next[LANG];
  document.getElementById("btnClose").textContent = UI.close[LANG];
  document.querySelectorAll(".langtoggle span").forEach(s =>
    s.classList.toggle("on", s.dataset.lang === LANG));

  const flat = [];
  document.getElementById("work").innerHTML = SETS.map(set => `
    <section class="section" id="${set.id}">
      <div class="head">
        <h2>${set.name[LANG]}</h2>
        <div class="meta mono">${set.note[LANG]}<br>${String(set.photos.length).padStart(2,"0")} ${UI.frames[LANG]}</div>
      </div>
      <div class="sheet">
        ${set.photos.map(p => {
          flat.push(p);
          return `<button class="cell ${p.size}" style="--ratio:${p.ratio}%" data-i="${flat.length-1}">
            <img class="media" src="photos/${p.src}" alt="${p.title[LANG]}" loading="lazy">
            <span class="no mono">${String(flat.length).padStart(3,"0")}</span>
            <span class="tag mono">${p.title[LANG]} — ${p.exif}</span>
          </button>`;
        }).join("")}
      </div>
    </section>`).join("");

  document.getElementById("navlist").innerHTML =
    SETS.map(s => `<li><a href="#${s.id}">${s.name[LANG]}</a></li>`).join("") +
    `<li><a href="#about">${UI.about[LANG]}</a></li>`;

  window._flat = flat;
  attachSpy();
}

document.getElementById("langtoggle").addEventListener("click", () => {
  LANG = LANG === "en" ? "fr" : "en";
  localStorage.setItem("wann-lang", LANG);
  render();
});

document.getElementById("yr").textContent = new Date().getFullYear();

/* ---------- lightbox ---------- */
const box = document.getElementById("box"), stage = document.getElementById("stage");
let cur = 0;
function show(i){
  const flat = window._flat;
  cur = (i + flat.length) % flat.length;
  const p = flat[cur];
  stage.innerHTML = `<img src="photos/${p.src}" alt="${p.title[LANG]}">`;
  capTitle.textContent = `${String(cur+1).padStart(3,"0")} — ${p.title[LANG]}`;
  capExif.textContent = p.exif;
  box.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeBox(){ box.classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("click", e => {
  const cell = e.target.closest(".cell");
  if (cell) return show(+cell.dataset.i);
  if (e.target.closest("[data-close]") || e.target === box) return closeBox();
  const nav = e.target.closest("[data-nav]");
  if (nav) show(cur + (+nav.dataset.nav));
});
document.addEventListener("keydown", e => {
  if (!box.classList.contains("open")) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowRight") show(cur+1);
  if (e.key === "ArrowLeft") show(cur-1);
});

/* ---------- highlight the section you're in ---------- */
function attachSpy(){
  const links = [...document.querySelectorAll(".nav a[href^='#']")];
  const spy = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + en.target.id));
  }), {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section, #about").forEach(s => spy.observe(s));
}

render();
</script>
</body>
</html>
