<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wann.ca — photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0C; --bone:#EDEAE4; --gray:#8A8A90; --line:#26262B;
  --safelight:#E23E2C; --pad:clamp(16px,4vw,60px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--pad);transition:background .4s,backdrop-filter .4s}
.nav.solid{background:rgba(10,10,12,.72);backdrop-filter:blur(14px) saturate(1.4)}
.mark{font-weight:800;font-size:15px;letter-spacing:-.02em}
.mark span{color:var(--safelight)}
.nav-right{display:flex;align-items:center;gap:clamp(12px,3vw,26px)}
.nav ul{display:flex;gap:clamp(10px,2.4vw,24px);list-style:none;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{color:var(--gray);white-space:nowrap;transition:color .25s}
.nav a:hover,.nav a.on{color:var(--bone)}
.langtoggle{display:flex;gap:3px;background:none;border:1px solid var(--line);border-radius:20px;padding:3px;cursor:pointer;flex:none}
.langtoggle span{padding:4px 9px;border-radius:16px;color:var(--gray);transition:.2s}
.langtoggle span.on{background:var(--bone);color:var(--ink)}

/* ---------- hero: image holds, text lifts away ---------- */
.hero{position:relative;height:100svh;min-height:540px;overflow:hidden}
.hero .frame{position:absolute;inset:0;will-change:transform,filter}
.hero .frame::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,12,.92) 4%,rgba(10,10,12,.1) 60%,rgba(10,10,12,.5))}
.hero-copy{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(30px,8vh,80px);z-index:2;will-change:transform,opacity}
.hero h1{font-weight:800;letter-spacing:-.05em;line-height:.8;font-size:clamp(66px,20vw,250px)}
.hero h1 em{font-style:normal;color:var(--safelight)}
.hero .strap{margin-top:16px;max-width:46ch;color:var(--gray);line-height:1.75}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;color:var(--gray);
  animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

/* ---------- chapter opener: sticky title, images pass behind ---------- */
.chapter{position:relative}
.opener{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:0 var(--pad);z-index:1;pointer-events:none}
.opener h2{font-size:clamp(46px,13vw,180px);font-weight:800;letter-spacing:-.05em;line-height:.85;
  opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.opener .sub{margin-top:14px;color:var(--gray);opacity:0;transform:translateY(24px);
  transition:opacity .9s ease .18s,transform .9s cubic-bezier(.2,.7,.2,1) .18s}
.opener.in h2,.opener.in .sub{opacity:1;transform:none}

/* ---------- the reveal stack ---------- */
.stack{position:relative;z-index:2;padding:0 var(--pad) clamp(60px,14vh,180px);
  display:flex;flex-direction:column;gap:clamp(60px,14vh,170px);margin-top:-40svh}
.plate{position:relative;overflow:hidden;background:#141418;cursor:zoom-in;border:none;padding:0;color:inherit;
  width:100%;border-radius:2px;
  opacity:0;transform:translateY(70px) scale(.965);filter:blur(6px);
  transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1),filter .9s ease}
.plate.in{opacity:1;transform:none;filter:none}
.plate::before{content:"";display:block;padding-top:var(--ratio,62%)}
.plate img{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.plate:hover img{transform:scale(1.03)}
.plate figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;
  gap:16px;padding:clamp(14px,2.4vw,26px);color:var(--bone);
  background:linear-gradient(to top,rgba(10,10,12,.82),transparent);text-align:left}
.plate .exif{color:var(--gray)}
/* alternate widths so the column breathes */
.plate.wide{max-width:100%}
.plate.mid{max-width:min(100%,880px);align-self:center}
.plate.tall{max-width:min(100%,560px);align-self:center}
.plate:nth-child(3n+2){align-self:flex-end}
.plate:nth-child(3n){align-self:flex-start}
@media(max-width:820px){
  .plate,.plate.mid,.plate.tall{max-width:100%;align-self:stretch!important}
  .stack{gap:56px;margin-top:-30svh}
}

/* ---------- about / footer ---------- */
.about{padding:clamp(70px,14vh,170px) var(--pad);display:grid;grid-template-columns:1.25fr 1fr;
  gap:clamp(26px,5vw,80px);align-items:start;border-top:1px solid var(--line)}
.about p{line-height:1.85;font-size:clamp(17px,2.2vw,22px);color:#C9C6C0;max-width:56ch;
  opacity:0;transform:translateY(28px);transition:.9s cubic-bezier(.2,.7,.2,1)}
.about.in p{opacity:1;transform:none}
.about p+p{transition-delay:.12s}
.specs{list-style:none;color:var(--gray);line-height:2.3;border-top:1px solid var(--line);padding-top:14px}
.specs b{color:var(--bone);font-weight:500}
@media(max-width:820px){.about{grid-template-columns:1fr}}
footer{padding:22px var(--pad) 36px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;
  justify-content:space-between;color:var(--gray)}
footer a:hover{color:var(--safelight)}

/* ---------- lightbox ---------- */
.box{position:fixed;inset:0;z-index:100;background:rgba(8,8,10,.98);display:none;align-items:center;
  justify-content:center;padding:clamp(12px,4vw,64px)}
.box.open{display:flex}
.box figure{max-width:min(1500px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.box .stage img{max-height:78svh;max-width:100%;width:auto;height:auto;object-fit:contain}
.box figcaption{display:flex;justify-content:space-between;gap:24px;width:100%;color:var(--gray)}
.box .ctrl{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:8px}
.box button{background:none;border:1px solid var(--line);color:var(--bone);padding:8px 14px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em}
.box button:hover{border-color:var(--safelight)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto}
  .plate,.opener h2,.opener .sub,.about p{opacity:1!important;transform:none!important;filter:none!important}
  .stack{margin-top:0}
  .opener{position:relative;height:auto;padding:clamp(50px,10vh,110px) var(--pad) 24px}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <a class="mark" href="#top">wann<span>.</span>ca</a>
  <div class="nav-right">
    <ul class="mono" id="navlist"></ul>
    <button class="langtoggle mono" id="langtoggle" aria-label="Switch language">
      <span data-lang="en">EN</span><span data-lang="fr">FR</span>
    </button>
  </div>
</nav>

<header class="hero" id="top">
  <div class="frame" id="heroframe"><img src="photos/street-youville.jpg" alt=""></div>
  <div class="hero-copy" id="herocopy">
    <h1>WANN<em>.</em></h1>
    <p class="strap mono" id="strap"></p>
  </div>
  <div class="cue mono" id="cue"></div>
</header>

<main id="work"></main>

<section class="about" id="about">
  <div>
    <p id="about1"></p>
    <p id="about2"></p>
  </div>
  <ul class="specs mono" id="specslist"></ul>
</section>

<footer class="mono">
  <span>© <span id="yr"></span> Antoine Wann</span>
  <span><a href="mailto:hello@wann.ca">hello@wann.ca</a></span>
</footer>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="ctrl">
    <button data-nav="-1" id="btnPrev">← Prev</button>
    <button data-nav="1" id="btnNext">Next →</button>
    <button data-close id="btnClose">Close ✕</button>
  </div>
  <figure>
    <div class="stage" id="stage"></div>
    <figcaption class="mono"><span id="capTitle"></span><span id="capExif"></span></figcaption>
  </figure>
</div>

<script src="content.js"></script>
<script>

let LANG = localStorage.getItem("wann-lang") || (navigator.language.startsWith("fr") ? "fr" : "en");
let flat = [];

function render(){
  document.documentElement.lang = LANG;
  strap.textContent = UI.strap[LANG];
  cue.textContent = UI.cue[LANG] + " ↓";
  about1.textContent = UI.about1[LANG];
  about2.textContent = UI.about2[LANG];
  specslist.innerHTML = `
    <li><b>${UI.specs.body[LANG]}</b> — Sony a6400</li>
    <li><b>${UI.specs.glass[LANG]}</b> — Sigma 30mm ƒ1.4 · Sony 18–135mm</li>
    <li><b>${UI.specs.edit[LANG]}</b> — Lightroom</li>
    <li><b>${UI.specs.based[LANG]}</b> — Québec, Canada</li>`;
  btnPrev.textContent = UI.prev[LANG];
  btnNext.textContent = UI.next[LANG];
  btnClose.textContent = UI.close[LANG];
  document.querySelectorAll(".langtoggle span").forEach(s => s.classList.toggle("on", s.dataset.lang === LANG));

  flat = [];
  work.innerHTML = SETS.map(set => `
    <section class="chapter" id="${set.id}">
      <div class="opener">
        <h2>${set.name[LANG]}</h2>
        <div class="sub mono">${set.note[LANG]} — ${String(set.photos.length).padStart(2,"0")} ${UI.frames[LANG]}</div>
      </div>
      <div class="stack">
        ${set.photos.map(p => {
          flat.push(p);
          return `<button class="plate ${p.shape}" style="--ratio:${p.ratio}%" data-i="${flat.length-1}">
            <img src="photos/${p.src}" alt="${p.title[LANG]}" loading="lazy">
            <figcaption class="mono"><span>${String(flat.length).padStart(3,"0")} — ${p.title[LANG]}</span><span class="exif">${p.exif}</span></figcaption>
          </button>`;
        }).join("")}
      </div>
    </section>`).join("");

  navlist.innerHTML = SETS.map(s => `<li><a href="#${s.id}">${s.name[LANG]}</a></li>`).join("")
    + `<li><a href="#about">${UI.about[LANG]}</a></li>`;

  observe();
}

/* reveal on entry */
function observe(){
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), {rootMargin:"0px 0px -12% 0px", threshold:.12});
  document.querySelectorAll(".plate,.opener,.about").forEach(el => io.observe(el));

  const links = [...document.querySelectorAll(".nav a[href^='#']")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
  }), {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll(".chapter,#about").forEach(s => spy.observe(s));
}

/* hero parallax + nav background, throttled to frames */
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY, vh = innerHeight;
    const t = Math.min(y / vh, 1);
    heroframe.style.transform = `scale(${1 + t * .14}) translateY(${t * 40}px)`;
    heroframe.style.filter = `brightness(${1 - t * .45})`;
    herocopy.style.transform = `translateY(${t * -90}px)`;
    herocopy.style.opacity = String(Math.max(0, 1 - t * 1.7));
    nav.classList.toggle("solid", y > vh * .7);
    ticking = false;
  });
}, {passive:true});

langtoggle.addEventListener("click", () => {
  LANG = LANG === "en" ? "fr" : "en";
  localStorage.setItem("wann-lang", LANG);
  render();
});
yr.textContent = new Date().getFullYear();

/* lightbox */
let cur = 0;
function show(i){
  cur = (i + flat.length) % flat.length;
  const p = flat[cur];
  stage.innerHTML = `<img src="photos/${p.src}" alt="${p.title[LANG]}">`;
  capTitle.textContent = `${String(cur+1).padStart(3,"0")} — ${p.title[LANG]}`;
  capExif.textContent = p.exif;
  box.classList.add("open"); document.body.style.overflow = "hidden";
}
function closeBox(){ box.classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("click", e => {
  const plate = e.target.closest(".plate");
  if (plate) return show(+plate.dataset.i);
  if (e.target.closest("[data-close]") || e.target === box) return closeBox();
  const n = e.target.closest("[data-nav]");
  if (n) show(cur + (+n.dataset.nav));
});
document.addEventListener("keydown", e => {
  if (!box.classList.contains("open")) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowRight") show(cur+1);
  if (e.key === "ArrowLeft") show(cur-1);
});

render();
</script>
</body>
</html>
